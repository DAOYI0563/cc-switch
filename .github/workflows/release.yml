name: Release Windows x64 portable EXE

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release-windows-x64:
    name: Build and publish Windows x64 portable EXE
    runs-on: windows-2022
    environment: release
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup pnpm
        shell: pwsh
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Setup Rust x64 toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.LOCALAPPDATA }}\pnpm\store
          key: windows-x64-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: windows-x64-pnpm-

      - name: Cache Cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-x64-release-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-x64-release-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag and project versions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoMatch = Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          $cargoVersion = $cargoMatch.Matches[0].Groups[1].Value
          foreach ($version in @($packageVersion, $tauriVersion, $cargoVersion)) {
            if ($version -ne $tagVersion) {
              throw "Tag version $tagVersion does not match project version $version"
            }
          }

      - name: Build portable EXE
        run: pnpm run build:portable

      - name: Prepare release files
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $binaryPath = "src-tauri/target/x86_64-pc-windows-msvc/release/wsl-code-switch.exe"
          if (-not (Test-Path -LiteralPath $binaryPath -PathType Leaf)) {
            throw "Expected portable EXE at $binaryPath"
          }
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $assetName = "WSL-Code-Switch-$version-Windows-x64-portable.exe"
          $assetPath = Join-Path release-assets $assetName
          Copy-Item -LiteralPath $binaryPath -Destination $assetPath
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $assetPath).Hash.ToLowerInvariant()
          "$hash  $assetName" | Set-Content -Encoding ascii "$assetPath.sha256"
          "asset_path=$assetPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "checksum_path=$assetPath.sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: WSL Code Switch ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.asset_path }}
            ${{ steps.package.outputs.checksum_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
