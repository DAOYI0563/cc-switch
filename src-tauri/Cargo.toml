[package]
name = "wsl-code-switch"
version = "3.19.4"
description = "Windows manager for Claude Code, Codex and OpenCode in WSL Ubuntu"
authors = ["Jason Young"]
license = "MIT"
repository = "https://github.com/farion1231/cc-switch"
edition = "2021"
rust-version = "1.85.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "wsl_code_switch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[features]
default = []
test-hooks = []

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tauri = { version = "2.8.2", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
dirs = "5.0"
toml = "0.8"
toml_edit = "0.22"
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream"] }
arboard = "3.6"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time", "sync"] }
futures = "0.3"
regex = "1.10"
thiserror = "2.0"
serde_yaml = "0.9"
url = "2.5"
once_cell = "1.21.3"
base64 = "0.22"
argon2 = { version = "0.5.3", features = ["zeroize"] }
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
zeroize = "1.8.1"
rusqlite = { version = "0.31", features = ["bundled"] }
indexmap = { version = "2", features = ["serde"] }
uuid = { version = "1.11", features = ["v4"] }
sha2 = "0.10"
json5 = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-single-instance = "2"
winreg = "0.52"
windows-sys = { version = "0.61", features = [
    "Win32_Globalization",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
] }

# Optimize the portable Windows executable for size.
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
# 使用 unwind 以便 panic hook 能捕获 backtrace（abort 会直接终止无法捕获）
panic = "unwind"
strip = "symbols"

[dev-dependencies]
serial_test = "3"
tempfile = "3"
